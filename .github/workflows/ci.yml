# Typecheck, lint, unit tests and a wrangler dry-run bundle of both Workers, on every push to main and every pull
# request. It deploys nothing and needs no credentials. Actions are pinned to full commit SHAs (Dependabot updates them).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.20.0
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Typecheck, lint and test
        run: npm run check
      - name: Bundle the monitor Worker without deploying
        run: npm run dry-run
      - name: Build the status page and bundle its Worker without deploying
        run: npm run dry-run:status-page
      - name: Start the monitor in the local Workers runtime and read its status
        # A dry run only bundles; this starts the Worker, which catches what the runtime itself refuses.
        run: |
          node_modules/.bin/wrangler dev --port 8799 --inspector-port 9339 --var DELIVERY_MODE:log --var LOCAL_DEV:true > wrangler-dev.log 2>&1 &
          dev=$!
          code=000
          for _ in $(seq 1 60); do
            code=$(curl -s -o status.json -w '%{http_code}' http://127.0.0.1:8799/api/status || true)
            [ "$code" != 000 ] && break
            sleep 1
          done
          kill "$dev"; wait "$dev" 2>/dev/null || true
          if [ "$code" != 200 ] || grep -q 'Uncaught' wrangler-dev.log; then cat wrangler-dev.log; echo "status $code" >&2; exit 1; fi
